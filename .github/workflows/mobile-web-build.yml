name: Mobile web build

on:
  push:
    branches: [mobile-compat]
    paths:
      - 'apps/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/mobile-web-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk and Binaryen
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          cargo install trunk --locked

      - name: Build browser app
        working-directory: apps/wordcraft-web
        run: trunk build --release

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-mobile-test
          path: apps/wordcraft-web/dist/
          if-no-files-found: error
          retention-days: 14
